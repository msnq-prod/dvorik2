services:
  core:
    build: .
    command: ["sh", "-c", "mkdir -p /data/media /data/backups && npm start"]
    env_file: ${DVORIK_ENV_FILE:-.env.modular}
    environment:
      DVORIK_SQLITE_FILE: /data/core.sqlite
      DVORIK_MEDIA_DIR: /data/media
      DVORIK_BACKUP_DIR: /data/backups
      PORT: 3001
      DVORIK_CASH_MODE: disabled
      DVORIK_STAFF_MODE: external
      DVORIK_STAFF_BASE_URL: http://staff:3202
      DVORIK_WAREHOUSE_MODE: external
      DVORIK_WAREHOUSE_BASE_URL: http://warehouse:3303
    volumes: ["core-data:/data"]
    ports: ["${DVORIK_WEB_BIND_ADDRESS:-127.0.0.1}:${DVORIK_WEB_PORT:-58082}:3001"]
    depends_on: [warehouse, staff]

  warehouse:
    build: .
    command: ["sh", "-c", "test -f /data/warehouse.sqlite || node scripts/build-warehouse-initial-db.mjs; npm run start:warehouse"]
    env_file: ${DVORIK_ENV_FILE:-.env.modular}
    environment:
      DVORIK_WAREHOUSE_SQLITE_FILE: /data/warehouse.sqlite
      DVORIK_CORE_BASE_URL: http://core:3001
      WAREHOUSE_PORT: 3303
    volumes: ["warehouse-data:/data"]

  staff:
    build: .
    command: ["npm", "run", "start:staff"]
    env_file: ${DVORIK_ENV_FILE:-.env.modular}
    environment:
      DVORIK_STAFF_SQLITE_FILE: /data/staff.sqlite
      DVORIK_CORE_BASE_URL: http://core:3001
      STAFF_PORT: 3202
    volumes: ["staff-data:/data"]

  company-worker:
    build: .
    command: ["sh", "-c", "mkdir -p /data/media /data/backups && npm run worker:company"]
    env_file: ${DVORIK_ENV_FILE:-.env.modular}
    environment:
      DVORIK_SQLITE_FILE: /data/core.sqlite
      DVORIK_MEDIA_DIR: /data/media
      DVORIK_BACKUP_DIR: /data/backups
      DVORIK_CASH_MODE: disabled
      DVORIK_STAFF_MODE: external
      DVORIK_STAFF_BASE_URL: http://staff:3202
      DVORIK_WAREHOUSE_MODE: external
      DVORIK_WAREHOUSE_BASE_URL: http://warehouse:3303
    volumes: ["core-data:/data"]
    depends_on: [core]

  staff-identity-worker:
    build: .
    command: ["npm", "run", "worker:staff-identity"]
    env_file: ${DVORIK_ENV_FILE:-.env.modular}
    environment:
      DVORIK_SQLITE_FILE: /data/core.sqlite
      DVORIK_STAFF_MODE: external
      DVORIK_STAFF_BASE_URL: http://staff:3202
      DVORIK_WAREHOUSE_MODE: external
      DVORIK_WAREHOUSE_BASE_URL: http://warehouse:3303
    volumes: ["core-data:/data"]
    depends_on: [core, staff]

  telegram-worker:
    build: .
    command: ["npm", "run", "worker:telegram"]
    env_file: ${DVORIK_ENV_FILE:-.env.modular}
    environment:
      DVORIK_SQLITE_FILE: /data/core.sqlite
      DVORIK_MEDIA_DIR: /data/media
      DVORIK_BACKUP_DIR: /data/backups
      DVORIK_CASH_MODE: disabled
      DVORIK_STAFF_MODE: external
      DVORIK_STAFF_BASE_URL: http://staff:3202
      DVORIK_WAREHOUSE_MODE: external
      DVORIK_WAREHOUSE_BASE_URL: http://warehouse:3303
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: ${DVORIK_TELEGRAM_PROXY_URL:-http://egress-proxy:3128}
      NO_PROXY: core,staff,warehouse,localhost,127.0.0.1
    volumes: ["core-data:/data"]
    depends_on: [core]
    networks: [default, telegram-egress]

volumes:
  core-data:
  warehouse-data:
  staff-data:

networks:
  telegram-egress:
    external: true
    name: ${DVORIK_TELEGRAM_EGRESS_NETWORK:-egress-proxy}
